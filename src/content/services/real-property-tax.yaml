title: Real Property Tax (Amilyar) Payment
description: Assessment and payment of annual basic real property tax and
  Special Education Fund levies on land, buildings, and machinery in San Jose
  del Monte.
category: Taxes & Property
office: City Treasury Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Treasurer’s Office, services 1 and 2: Statement of Real
  Property Tax and official receipt (printed pp. 223–224; PDF pp. 232–233)"
sourceDate: 2026, 2nd Edition (pp. 223-224)
verified: 2026-11-04
sample: false
keywords:
  - real property tax
  - amilyar
  - rpt
  - buwis sa lupa
  - treasury
  - tax clearance
eligibility: A taxpayer who owns real property in the city, whether resident or
  non-resident, or an authorized representative.
requirements:
  - "For the tax statement, the charter says you may present any or all of:
    valid identification (original or photocopy), latest tax receipt, latest tax
    declaration, or a copy of the transfer certificate of title."
  - "For a representative: SPA, authorization, or secretary’s certificate, as
    applicable. Confirm which documents the office needs."
  - "For payment: the Statement of Real Property Tax issued by the City
    Treasurer’s Office."
steps:
  - Request a Statement of Real Property Tax at assessment counter 5, 6, 7, or 8
    and present identification and necessary documents.
  - Present the statement to RPT cashier counter 11, 12, or 14.
  - Pay the assessed amount and obtain the official receipt (AF-56).
fees: The charter lists basic real property tax at 1.1% of assessed value plus
  1% for the Special Education Fund. It states that unpaid tax accrues 2%
  monthly interest, limited to 36 months. Confirm your assessed amount and
  current rules with the City Treasurer’s Office.
processingTime: The charter lists 5 minutes for the statement and 5 minutes for
  payment, per transaction.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
