title: Real Property Tax (Amilyar) Payment
description: Assessment and payment of annual basic real property tax and
  Special Education Fund levies on land, buildings, and machinery in San Jose
  del Monte.
category: Taxes & Property
office: City Treasury Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Treasury Office, services 1 & 2: Statement of Real Property
  Tax and Issuance of Official Receipts (AF-56)"
sourceDate: 2026, 2nd Edition (pp. 223-224)
verified: 2026-11-03
sample: false
location: City Treasury Office (CTO), Ground Floor, New Government Center,
  Barangay Dulong Bayan, City of San Jose del Monte, Bulacan
contact: (044) 919-7370 local 1116 to 1117 / cto_sjdm@yahoo.com.ph
keywords:
  - real property tax
  - amilyar
  - rpt
  - buwis sa lupa
  - treasury
  - tax clearance
eligibility: Any property owner or authorized representative paying taxes on
  real property situated within San Jose del Monte.
requirements:
  - Valid government-issued photo identification
  - Previous Real Property Tax Official Receipt (AF-56)
  - Latest Tax Declaration from the City Assessor's Office
  - Copy of Transfer Certificate of Title (TCT) if updating records
  - Notarized Special Power of Attorney or Authorization Letter if paying
    through a representative
steps:
  - Present previous tax receipt or tax declaration at Treasury Assessment
    Counters 5, 6, 7, or 8 to compute tax due (5 minutes).
  - Receive Statement of Real Property Tax.
  - Present Statement to RPT Cashier Counters 11, 12, or 14 and pay assessed
    amount (5 minutes).
  - Secure Official Receipt (Accountable Form No. 56).
fees: Basic Real Property Tax is 1.1% of assessed value; Special Education Fund
  (SEF) is 1.0% of assessed value (total 2.1%). Delinquent accounts incur 2%
  monthly interest capped at a maximum of 36 months (72%) per RA 7160 Section
  255.
processingTime: 10 minutes total counter turnaround per property unit for
  walk-in transactions (5 minutes assessment + 5 minutes cashier payment).
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
