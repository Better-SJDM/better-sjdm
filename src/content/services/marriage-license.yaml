title: Application for Marriage License
description: Processing and issuance of a legal license to contract marriage
  under the Family Code of the Philippines.
category: Civil Registry & Identity
office: City Civil Registry Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Civil Registry Office, service 7: Application for marriage
  license (printed pp. 190–191; PDF pp. 199–200)"
sourceDate: 2026, 2nd Edition (pp. 190-191)
verified: 2026-11-04
sample: false
keywords:
  - marriage license
  - kasal
  - lisensya sa kasal
  - ccro
  - cenomar
  - pre-marriage counseling
eligibility: The charter lists couples aged 18 or above. It says the license is
  obtained where either applicant habitually resides and both applicants must
  appear personally.
requirements:
  - Latest certified local or PSA birth certificate; if there is no birth
    record, latest baptismal record. Original and two photocopies.
  - CENOMAR for both parties, original and two photocopies.
  - Pre-marriage counseling certificate, original and two photocopies.
  - Valid ID and cedula of both parties, original and two photocopies.
  - "For ages 18–20: parental consent; the charter asks parents or guardian to
    appear with valid ID. Original and two photocopies."
  - "For ages 21–24: parental advice; the charter asks parents or guardian to
    appear with valid ID. Original and two photocopies."
  - "If a previous marriage was annulled: certified true copies of the decision,
    finality, decree of absolute nullity, certificate of authenticity, and
    certificate of registration. Confirm which documents apply."
  - "For a foreign applicant: legal capacity issued by the respective embassy in
    the Philippines, original and two photocopies."
  - "If divorced: divorce certificate or decree and passport, original and two
    photocopies. Confirm applicable recognition requirements with the civil
    registry."
  - "If widowed: PSA copy or certified true copy of the spouse’s death
    certificate, original and two photocopies."
steps:
  - Sign the attendance sheet and obtain a transaction number.
  - Submit complete requirements for evaluation and receive the application form
    and order of payment.
  - Pay at the City Treasurer’s Office and keep the official receipt.
  - Return the receipt to the civil registry and receive a claim stub.
  - Return on the release date after the posting period to claim the license.
fees: The charter lists an application fee of ₱300.
processingTime: The charter lists 10 days and 30 minutes, including the 10-day posting period.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
