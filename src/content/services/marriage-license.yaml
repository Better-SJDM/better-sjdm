title: Application for Marriage License
description: Processing and issuance of a legal license to contract marriage
  under the Family Code of the Philippines.
category: Civil Registry & Identity
office: City Civil Registry Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Civil Registry Office, service 7: Application for Marriage License"
sourceDate: 2026, 2nd Edition (pp. 190-191)
verified: 2026-11-03
sample: false
location: City Civil Registry Office (CCRO), Upper Ground Floor, New Government
  Center, Barangay Dulong Bayan, City of San Jose del Monte, Bulacan
contact: (044) 919-7370 local 1214 / 0999-544-9677 / csjdmlcro@gmail.com
keywords:
  - marriage license
  - kasal
  - lisensya sa kasal
  - ccro
  - cenomar
  - pre-marriage counseling
eligibility: Male and female applicants aged 18 and above, where at least one
  party is a bona fide resident of San Jose del Monte. Both applicants must
  appear personally.
requirements:
  - Certified Local Copy or PSA Copy of Birth Certificate for both parties
    (Original and 2 photocopies)
  - Certificate of No Marriage Record (CENOMAR) from PSA for both parties valid
    within 6 months (Original and 2 photocopies)
  - Pre-Marriage Counseling Certificate from the City Population Office
    (Original and 2 photocopies)
  - Valid government-issued photo ID and Community Tax Certificate (Cedula) for
    both parties (Original and 2 photocopies)
  - Parental Consent form for applicants aged 18 to 20 with parents appearing
    personally with valid ID (Original and 2 photocopies; Family Code Art. 14)
  - Parental Advice form for applicants aged 21 to 24 with parents appearing
    personally with valid ID (Original and 2 photocopies; Family Code Art. 15)
  - Death Certificate of deceased spouse (if widowed) or Judicial Decree of
    Annulment / Nullity (if previously married)
  - Certificate of Legal Capacity to Contract Marriage issued by diplomatic
    embassy (for foreign nationals)
steps:
  - Sign attendance sheet and get transaction number at CCRO triage (2 minutes).
  - Submit documentary requirements at Window 9 for evaluation and receive
    application form and order of payment (12 minutes).
  - Pay application fee at the City Treasury counter and secure Official Receipt
    (5 minutes).
  - Return receipt to Window 9, receive claim stub, and initiate mandatory 10
    consecutive days public posting (10 minutes).
  - Return on designated claim date following completion of posting and receive
    approved Marriage License at Window 9 (1 minute).
fees: ₱300.00 total application fee. Indigent Filipino couples residing in the
  city for at least five years are exempt from fees under Family Code Article
  19.
processingTime: 10 days and 30 minutes (includes statutory 10 consecutive
  calendar days public posting period per Family Code Art. 17). Valid for 120
  days nationwide (Family Code Art. 20).
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
