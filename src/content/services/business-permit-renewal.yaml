title: Business Permit (Renewal)
description: Annual renewal of Mayor's Permit and business licenses for existing
  commercial enterprises operating in San Jose del Monte.
category: Business & Licensing
office: Business Permits and Licensing Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Business Permits & Licensing Office, service 2: Issuance of
  Business Permit (Renewal)"
sourceDate: 2026, 2nd Edition (pp. 41-52)
verified: 2026-11-03
sample: false
location: Government Service Express, Basement 2, SM City San Jose Del Monte,
  Quirino Highway, Barangay Tungkong Mangga, City of San Jose del Monte, Bulacan
contact: (044) 306-4637 / 0912-599-6151 / bplocsjdm_16@yahoo.com
keywords:
  - business permit renewal
  - mayors permit renewal
  - bplo
  - pagpapanibago ng permit
  - renewal ng negosyo
  - gross sales
eligibility: All existing business establishments operating within the
  territorial jurisdiction of San Jose del Monte.
requirements:
  - Accomplished Business Permit Renewal Application Form
  - Barangay Business Clearance / Order of Payment for the current calendar year
  - Audited Financial Statements, BIR Income Tax Returns, or Sworn Declaration
    of Gross Sales / Receipts of the preceding calendar year
  - Previous Year Business Permit and Official Receipt
  - Fire Safety Inspection Certificate (FSIC) from BFP CSJDM
  - Sanitary Permit from City Health Office
  - Environmental Inspection Certificate from CENRO
  - Notarized Authorization Letter or Special Power of Attorney with valid IDs
    if represented by an agent
steps:
  - Submit renewal application and upload supporting documents at
    https://bpbc.ibpls.com/cityofsanjosedelmontebulacan or at BPLO counter.
  - Receive verified Tax Order of Payment from BPLO assessment division (approx.
    20 minutes).
  - Pay computed business taxes and regulatory fees online or at the City
    Treasury cashier (approx. 30 minutes).
  - Claim renewed Mayor's Permit and validation sticker at BPLO Counter 9 or 10
    (approx. 10 minutes).
fees: Computed from declared gross receipts of preceding calendar year per Tax
  Ordinance No. C-011. A 25% surcharge plus 2% monthly interest apply to unpaid
  taxes after the statutory deadline (January 20, unless extended by city
  ordinance).
processingTime: 1 hour 30 minutes active transaction time; up to 3 working days
  total turnaround.
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
