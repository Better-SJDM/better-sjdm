title: Business Permit (Renewal)
description: Annual renewal of Mayor's Permit and business licenses for existing
  commercial enterprises operating in San Jose del Monte.
category: Business & Licensing
office: Business Permits and Licensing Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Business Permits and Licensing Office, service 2: Issuance of
  Business Permit (Renewal) (printed pp. 34–38; PDF pp. 43–47)"
sourceDate: 2026, 2nd Edition (pp. 41-52)
verified: 2026-11-04
sample: false
keywords:
  - business permit renewal
  - mayors permit renewal
  - bplo
  - pagpapanibago ng permit
  - renewal ng negosyo
  - gross sales
eligibility: Business owners operating in the city, as described in the charter.
requirements:
  - Barangay order of payment (one original and one photocopy).
  - BIR returns and/or a notarized declaration of the previous year’s gross
    sales; financial statements if required (one original and one photocopy).
  - "If the business has branches outside the city: breakdown of sales by city
    or municipality and the business permit application for those locations."
  - Annual electrical inspection fees and certificate of occupancy if required
    (one original and one photocopy).
  - Sanitary permit, environmental inspection certificate, and fire safety
    inspection certificate (one original and one photocopy of each).
  - Additional national agency requirements for specific businesses, if
    applicable.
  - "If a representative applies: the charter specifies notarized authority
    documents according to business type, plus IDs of the owner or corporate
    secretary and representative. Confirm the document required for your
    business."
steps:
  - Create an application using a valid email address in the online portal,
    upload the required documents, submit, and monitor the application.
  - View and print the tax order of payment after assessment.
  - Pay the assessed fees through the online channels listed by the charter and
    keep the official receipt.
  - Claim the printed permit and business plate at BPLO counters 9 or 10 and
    sign the logbook.
fees: The charter says tax is assessed using the previous calendar year’s gross
  receipts and describes a 25% surcharge plus 2% monthly interest for late
  payment. Confirm deadlines, extensions, and charges with BPLO.
processingTime: The charter lists 3 days and notes that processing may vary with
  application volume.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
