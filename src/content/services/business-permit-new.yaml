title: Business Permit (New Application)
description: Mandatory municipal license for establishing and operating a
  commercial or industrial enterprise in San Jose del Monte.
category: Business & Licensing
office: Business Permits and Licensing Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Business Permits and Licensing Office, service 1: Issuance of
  Business Permit (New) (printed pp. 24–33; PDF pp. 33–42)"
sourceDate: 2026, 2nd Edition (pp. 24-40)
verified: 2026-11-04
sample: false
keywords:
  - business permit
  - mayors permit
  - new business
  - bplo
  - permit sa negosyo
  - bagong negosyo
  - ibpls
eligibility: Individuals or corporations establishing or operating business
  activities in the city, as described in the charter.
requirements:
  - "Business name registration: DTI for sole proprietorship; SEC registration
    and articles of incorporation for the listed corporate or partnership forms;
    or CDA registration and certificate of compliance for a cooperative (one
    original and one photocopy)."
  - Barangay order of payment from the barangay where the business is located
    (one original and one photocopy).
  - Annual electrical inspection fees and certificate of occupancy if required
    (one original and one photocopy).
  - Locational clearance and, if applicable, Local Zoning Board of Adjustment
    and Appeals clearance (one original and one photocopy).
  - Sanitary permit, environmental inspection certificate, and fire safety
    inspection certificate for occupancy, each one original and one photocopy.
    The charter states the fire certificate is valid for 90 days from issuance.
  - Contract of lease and lessor’s permit if leasing (one original and one
    photocopy).
  - Sworn statement to operate as office only (one original and one photocopy),
    as listed in the charter. Confirm applicability.
  - "If a representative applies: the charter specifies notarized authority
    documents according to business type, plus IDs of the owner or corporate
    secretary and representative. Confirm the document required for your
    business."
  - Photograph of the establishment and signage; include CCTV cameras and
    monitoring if required (one photocopy).
  - Land title and tax declaration, neighbor’s consent or homeowners’
    association certificate, and contract agreement, each if required (one
    original and one photocopy).
  - Additional national agency requirements may apply to specific businesses.
    Check the charter and confirm the applicable list with BPLO.
steps:
  - Create an application through the online portal listed in the charter,
    upload documents, submit, and monitor the application.
  - Print the system-generated tax order of payment after assessment; the
    charter includes a location inspection.
  - Pay assessed fees through the listed online channels and keep the official
    receipt.
  - Claim the printed permit and business plate at BPLO counters 9 or 10 and
    sign the logbook.
fees: The charter says business tax and regulatory fees are assessed according
  to the business and the city revenue code. Confirm the amount with BPLO.
processingTime: The charter lists 3 days and notes that processing may vary with
  application volume.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
