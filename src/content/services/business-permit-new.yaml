title: Business Permit (New Application)
description: Mandatory municipal license for establishing and operating a
  commercial or industrial enterprise in San Jose del Monte.
category: Business & Licensing
office: Business Permits and Licensing Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Business Permits & Licensing Office, service 1: Issuance of
  Business Permit (New)"
sourceDate: 2026, 2nd Edition (pp. 24-40)
verified: 2026-11-03
sample: false
location: Government Service Express, Basement 2, SM City San Jose Del Monte,
  Quirino Highway, Barangay Tungkong Mangga, City of San Jose del Monte, Bulacan
contact: (044) 306-4637 / 0912-599-6151 / bplocsjdm_16@yahoo.com
keywords:
  - business permit
  - mayors permit
  - new business
  - bplo
  - permit sa negosyo
  - bagong negosyo
  - ibpls
eligibility: Any individual proprietor, partnership, corporation, one-person
  corporation (OPC), or cooperative establishing operations within San Jose del
  Monte.
requirements:
  - DTI Registration (Sole Proprietorship), SEC Registration & Articles of
    Incorporation (Corporation/Partnership), or CDA Registration & Certificate
    of Compliance (Cooperative) (1 original, 1 photocopy)
  - Barangay Business Clearance / Order of Payment from the host barangay (1
    original, 1 photocopy)
  - Locational Clearance / Zoning Certificate from City Planning and Development
    Office (CPDO) (1 original, 1 photocopy)
  - Certificate of Occupancy and Annual Electrical Inspection Fees from Office
    of the City Building Official (OCBO) (1 original, 1 photocopy)
  - Sanitary Permit from City Health Office (CHO) (1 original, 1 photocopy)
  - Environmental Inspection Certificate from CENRO (1 original, 1 photocopy)
  - Fire Safety Inspection Certificate (FSIC for Occupancy) from BFP CSJDM valid
    for 90 days (1 original, 1 photocopy)
  - Contract of Lease and Lessor's Permit if space is leased (1 original, 1
    photocopy)
  - Photographs of commercial signage and CCTV system if applicable (1 copy)
  - Notarized Secretary Certificate or Special Power of Attorney with valid IDs
    if applying through a representative
steps:
  - Create an account and submit application online at
    https://bpbc.ibpls.com/cityofsanjosedelmontebulacan or at the BPLO counter.
  - Wait for document verification and receipt of system-generated Tax Order of
    Payment (approx. 20 minutes).
  - Pay assessed business taxes and regulatory fees online (eGov Pay, Landbank,
    GCash, Maya) or at City Treasury cashier (approx. 30 minutes).
  - Claim printed business permit and business plate at BPLO Counter 9 or 10 at
    SM City San Jose Del Monte (approx. 10 minutes).
fees: Assessed per CSJDM Revised Revenue Code (Tax Ordinance No. C-011) based on
  capital investment and line of business.
processingTime: 1 hour 30 minutes active transaction time; statutory completion
  up to 3 working days depending on verification volume.
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
