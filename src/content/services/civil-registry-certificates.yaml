title: Certified Copy of Birth, Marriage, or Death Certificate
description: Issuance of certified true copies or local certifications of vital
  events registered in the archives of San Jose del Monte.
category: Civil Registry & Identity
office: City Civil Registry Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Civil Registry Office, service 1: Certified photocopy or
  certification of birth, death, and marriage certificates (printed pp. 180–181;
  PDF pp. 189–190)"
sourceDate: 2026, 2nd Edition (pp. 180-181)
verified: 2026-11-04
sample: false
keywords:
  - birth certificate
  - marriage certificate
  - death certificate
  - ccro
  - katibayan ng kapanganakan
  - katibayan ng kasal
  - katibayan ng kamatayan
  - lcr
eligibility: The charter lists the document owner or authorized representative;
  spouse, parent, direct descendant, guardian or institution legally in charge
  of a minor; a court or proper public official in specified proceedings; and
  nearest kin when the person has died.
requirements:
  - "For the owner: government-issued identification."
  - "For a representative: authorization from the owner and signed photocopies
    of the government-issued IDs of both the owner and representative."
  - "For direct descendants, guardians, or institutions legally in charge of a
    minor: affidavit of guardianship, as listed in the charter; confirm
    applicability with the office."
  - "For a court or proper public official: court order."
  - "For nearest kin: affidavit of nearest kin."
steps:
  - Sign the attendance sheet, obtain a transaction number, and receive a
    verification slip.
  - Complete the slip and submit it with the applicable documents for
    verification.
  - If the record is found, pay the order of payment at the City Treasurer’s
    Office and keep the official receipt.
  - Return the receipt to the civil registry window and claim the certified copy
    or certification when called.
fees: The charter lists ₱35 per certified true copy for local use, ₱50 per
  certification, and ₱100 per certified true copy for use abroad.
processingTime: The charter lists 21 minutes.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
