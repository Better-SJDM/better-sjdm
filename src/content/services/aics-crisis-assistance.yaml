title: Assistance to Individuals in Crisis Situations (AICS)
description: City government emergency welfare assistance providing medical,
  burial, and financial grants for indigent residents facing acute hardship.
category: Social Welfare & Health
office: City Social Welfare and Development Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Social Welfare and Development Office, service 1:
  Assistance to Individuals in Crisis Situation (PDF pp. 467–469)"
sourceDate: 2026, 2nd Edition (pp. 456-458)
verified: 2026-11-04
sample: false
keywords:
  - aics
  - cswdo
  - ayuda
  - medical assistance
  - burial assistance
  - financial assistance
  - tulong medikal
  - libing
eligibility: The charter lists indigent San Joseños in crisis situations,
  including sickness, death, hunger, and manmade or natural calamities.
requirements:
  - "For medical assistance: barangay certificate of indigency stating medical
    assistance (one original and one photocopy) and a letter of intent to the
    City Mayor (one original)."
  - "For medical assistance, as applicable: updated medical certificate or
    clinical abstract and updated prescription or hospital bill (one original
    and two photocopies of each)."
  - "For burial assistance: barangay certificate of indigency stating burial
    assistance (one original and one photocopy) and a letter of intent to the
    City Mayor (one original)."
  - "For burial assistance, as applicable: funeral contract or promissory note
    and death certificate (one original and two photocopies of each)."
  - "For financial or emergency food assistance: barangay certificate of
    indigency stating the purpose (one original and one photocopy) and a letter
    of intent to the City Mayor (one original)."
  - "For each type of assistance: valid ID of the client or authorized
    representative (one original and two photocopies)."
steps:
  - Obtain a queue number and wait for document screening at the social worker’s
    desk.
  - Submit the applicable documents and participate in the interview and
    assessment.
  - Receive the claim stub and follow the office’s instructions.
fees: The charter lists no fee.
processingTime: The charter lists 14 minutes for the stated steps; it does not
  give a date for release of assistance.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
