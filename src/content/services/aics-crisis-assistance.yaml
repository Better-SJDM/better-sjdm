title: Assistance to Individuals in Crisis Situations (AICS)
description: City government emergency welfare assistance providing medical,
  burial, and financial grants for indigent residents facing acute hardship.
category: Social Welfare & Health
office: City Social Welfare and Development Office
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "City Social Welfare and Development Office, service 1:
  Assistance to Individuals in Crisis Situation"
sourceDate: 2026, 2nd Edition (pp. 456-458)
verified: 2026-11-03
sample: false
location: City Social Welfare and Development Office (CSWDO), New Government
  Center, Barangay Dulong Bayan, City of San Jose del Monte, Bulacan
contact: (044) 919-7370 local 1111 to 1115 / cswdo.csjdm@gmail.com
keywords:
  - aics
  - cswdo
  - ayuda
  - medical assistance
  - burial assistance
  - financial assistance
  - tulong medikal
  - libing
eligibility: Indigent residents of San Jose del Monte in crisis due to illness,
  hospitalization, or death of a family member.
requirements:
  - Barangay Certificate of Indigency explicitly stating purpose of assistance
    (1 original, 1 photocopy)
  - Letter of Intent addressed to the City Mayor requesting assistance (1
    original)
  - Valid government photo ID of applicant and patient/deceased (1 original, 2
    photocopies)
  - Updated Medical Certificate / Clinical Abstract from hospital (for medical
    aid, 1 original, 2 photocopies)
  - Updated Hospital Bill or prescription with price quotation (for medical aid,
    1 original, 2 photocopies)
  - Registered Death Certificate from Local Civil Registry (for burial aid, 1
    original, 2 photocopies)
  - Funeral Contract or Promissory Note from funeral home (for burial aid, 1
    original, 2 photocopies)
steps:
  - Secure queue number at CSWDO waiting area and present documents for triage
    screening (5 minutes).
  - Undergo assessment interview with licensed social worker (7 minutes).
  - Receive claim stub and follow up for check or guarantee letter voucher
    release (2 minutes).
fees: Free. No application or processing fees are charged.
processingTime: 14 minutes counter assessment duration; disbursement follows
  city treasury voucher scheduling.
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
