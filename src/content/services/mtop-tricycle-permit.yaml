title: Motorized Tricycle Operator's Permit (MTOP)
description: Municipal franchise and permit to legally operate a motorized
  tricycle-for-hire within designated routes in San Jose del Monte.
category: Transport & Franchising
office: Tricycle Regulatory Unit
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Tricycle Regulatory Unit, service 1: Issuance of Motorized
  Tricycle Operator’s Permit (printed pp. 54–55; PDF pp. 63–64)"
sourceDate: 2026, 2nd Edition (pp. 54-55)
verified: 2026-11-04
sample: false
relatedEmergency: true
keywords:
  - mtop
  - tricycle permit
  - prangkisa
  - toda
  - tru
  - tricycle for hire
eligibility: The charter lists operators and drivers of tricycles for hire in the city.
requirements:
  - TODA certificate from the concerned TODA or TSC.
  - Latest barangay clearance.
  - Latest community tax certificate or cedula.
  - Motorcycle certificate of registration (CR).
  - Latest motorcycle official receipt with for-hire classification.
  - Professional driver’s license with restriction code 1, as stated in the
    charter. Confirm current license requirements with the office.
  - Contract or deed of sale, if necessary.
  - Federation certificate, if required by the TODA federation (one original).
steps:
  - Submit the completed application and requirements; the office evaluates them
    and inspects the tricycle.
  - Receive the tax order of payment and pay at the cashier.
  - Present the official receipt and claim the MTOP, confirmation for LTO, and
    sticker or MTOP plate as applicable.
fees: The charter lists a ₱1,287.50 total excluding penalty and MTOP plate. Its
  fee table separately lists a ₱100 MTOP plate and a ₱325 penalty; confirm which
  charges apply.
processingTime: The charter lists 35 minutes.
sourceNote: Based on the 2026 Citizen’s Charter. Requirements, fees, locations,
  and processing times may have changed; confirm current details with the
  responsible office.
stepsSource: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
