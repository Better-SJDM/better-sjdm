title: Motorized Tricycle Operator's Permit (MTOP)
description: Municipal franchise and permit to legally operate a motorized
  tricycle-for-hire within designated routes in San Jose del Monte.
category: Transport & Franchising
office: Tricycle Regulatory Unit
source: https://csjdm.gov.ph/wp-content/uploads/2026/06/CGO-SAN-JOSE-DEL-MONTE-CITIZENS-CHARTER-2026-2ND-EDITION.pdf
sourceSection: "Tricycle Regulatory Unit, service 1: Issuance of Motorized
  Tricycle Operator's Permit (MTOP)"
sourceDate: 2026, 2nd Edition (pp. 54-55)
verified: 2026-11-03
sample: false
relatedEmergency: true
location: Tricycle Regulatory Unit (TRU), Dulong Bayan, City of San Jose del
  Monte, Bulacan
contact: (044) 306-3345 / tru.csjdm@gmail.com
keywords:
  - mtop
  - tricycle permit
  - prangkisa
  - toda
  - tru
  - tricycle for hire
eligibility: Operators and drivers of tricycles-for-hire in San Jose del Monte
  holding an authorized slot within an accredited TODA.
requirements:
  - TODA Certificate from concerned association (1 original)
  - Federation Certificate as required by TODA Federation (1 original)
  - Latest Barangay Clearance (1 original)
  - Latest Community Tax Certificate / Cedula (1 original)
  - Certificate of Registration of Motorcycle (CR) from LTO (1 copy)
  - Latest Official Receipt (OR) from LTO with For-Hire classification (1 copy)
  - Professional Driver's License with Restriction Code 1 (1 copy)
  - Contract or Deed of Sale if motorcycle ownership was transferred
steps:
  - Submit application form, requirements, and present tricycle unit for
    physical roadworthiness inspection (10 minutes).
  - Encode data, assess fees, and pay Tax Order of Payment at cashier (15
    minutes).
  - Review, approval, and release of MTOP, LTO Confirmation, sticker, and MTOP
    Plate (10 minutes).
fees: Base franchise and registration fee is ₱1,287.50 under Sections 198 and
  200 of the CSJDM Revenue Code. MTOP Plate costs an additional ₱100.00; late
  renewal penalty is ₱325.00.
processingTime: 35 minutes total counter turnaround.
sourceNote: Details are transcribed from the research report. The full 2026
  charter could not be independently opened during this review; confirm current
  requirements, fees, and processing times with the office.
